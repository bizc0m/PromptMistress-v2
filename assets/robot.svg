<svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jointGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a4a4a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Head -->
  <ellipse cx="60" cy="40" rx="32" ry="36" fill="url(#shellGrad)" stroke="#333" stroke-width="1.5"/>
  <!-- Visor -->
  <rect x="30" y="25" width="60" height="28" rx="4" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  <!-- Eye highlights -->
  <ellipse cx="42" cy="35" rx="6" ry="8" fill="#f5f5f5" opacity="0.7"/>
  <ellipse cx="78" cy="35" rx="6" ry="8" fill="#f5f5f5" opacity="0.7"/>
  <!-- Red eyes -->
  <path d="M 38 42 L 46 50 L 38 50 Z" fill="#ff2020"/>
  <path d="M 74 42 L 82 50 L 74 50 Z" fill="#ff2020"/>

  <!-- Neck collar (red) -->
  <ellipse cx="60" cy="72" rx="24" ry="8" fill="#ff3030" stroke="#cc0000" stroke-width="1"/>
  <ellipse cx="60" cy="74" rx="22" ry="6" fill="#ff4040" opacity="0.8"/>

  <!-- Body -->
  <rect x="32" y="78" width="56" height="48" rx="6" fill="url(#shellGrad)" stroke="#333" stroke-width="1.5"/>
  <!-- OpenAI logo on chest -->
  <g transform="translate(60, 95)">
    <circle cx="0" cy="0" r="7" fill="none" stroke="#333" stroke-width="1.2"/>
    <path d="M -3 -3 Q 0 -1 3 -3 Q 1 0 3 3 Q 0 1 -3 3 Q -1 0 -3 -3" fill="#333" opacity="0.6"/>
  </g>

  <!-- Left arm -->
  <rect x="18" y="85" width="12" height="32" rx="6" fill="url(#shellGrad)" stroke="#333" stroke-width="1.5"/>
  <circle cx="24" cy="82" r="8" fill="url(#jointGrad)" stroke="#000" stroke-width="1"/>
  <circle cx="24" cy="120" r="7" fill="url(#jointGrad)" stroke="#000" stroke-width="1"/>
  <!-- Left hand grip -->
  <rect x="16" y="125" width="16" height="6" rx="2" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>

  <!-- Right arm -->
  <rect x="90" y="85" width="12" height="32" rx="6" fill="url(#shellGrad)" stroke="#333" stroke-width="1.5"/>
  <circle cx="96" cy="82" r="8" fill="url(#jointGrad)" stroke="#000" stroke-width="1"/>
  <circle cx="96" cy="120" r="7" fill="url(#jointGrad)" stroke="#000" stroke-width="1"/>
  <!-- Head censor (black sphere on right) -->
  <circle cx="102" cy="75" r="9" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  <circle cx="103" cy="72" r="3" fill="#666" opacity="0.5"/>

  <!-- Left leg -->
  <rect x="38" y="128" width="12" height="32" rx="6" fill="url(#shellGrad)" stroke="#333" stroke-width="1.5"/>
  <circle cx="44" cy="125" r="7" fill="url(#jointGrad)" stroke="#000" stroke-width="1"/>
  <circle cx="44" cy="163" r="6" fill="url(#jointGrad)" stroke="#000" stroke-width="1"/>

  <!-- Right leg -->
  <rect x="70" y="128" width="12" height="32" rx="6" fill="url(#shellGrad)" stroke="#333" stroke-width="1.5"/>
  <circle cx="76" cy="125" r="7" fill="url(#jointGrad)" stroke="#000" stroke-width="1"/>
  <circle cx="76" cy="163" r="6" fill="url(#jointGrad)" stroke="#000" stroke-width="1"/>

  <!-- Red accent band on collar -->
  <rect x="40" y="68" width="40" height="3" fill="#ff2020" stroke="#cc0000" stroke-width="0.5"/>
</svg>